          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_certificates:
            - certificate_chain: { filename: "/Users/kamlesh/kytelang/varman/.e2e/api.openai.com.crt" }
              private_key: { filename: "/Users/kamlesh/kytelang/varman/.e2e/api.openai.com.key" }
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
