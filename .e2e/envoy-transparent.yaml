          http_filters:
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  function envoy_on_request(handle)
                    local body = handle:body(true)
                    local b = ""
                    if body ~= nil and body:length() > 0 then b = body:getBytes(0, body:length()) end
                    local h, _ = handle:httpCall("content", { [":method"]="POST", [":path"]="/cf/check", [":authority"]="sidecar", ["content-type"]="text/plain" }, b, 5000)
                    if h == nil or h[":status"] ~= "200" then
                      handle:respond({ [":status"]="403", ["content-type"]="text/plain", ["x-acp-content-verdict"]="deny" }, "blocked by content policy\n")
                    end
                  end

          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
