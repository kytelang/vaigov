  clusters:
  - name: content
    connect_timeout: 2s
    type: STRICT_DNS
    load_assignment:
      cluster_name: content
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 8899 } } }
  - name: httpbin_upstream
    connect_timeout: 10s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: httpbin_upstream
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: httpbin.org, port_value: 443 } } }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: httpbin.org
  - name: anthropic
    connect_timeout: 10s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: anthropic
      endpoints:
