## Varman content-firewall demo data plane (multi-host).
## TLS-bumps httpbin.org + the three governed AI providers (Claude/ChatGPT/Gemini);
## each chain runs the Lua content check against the Kyte sidecar before egress.
static_resources:
  listeners:
  - name: ingress
    address: { socket_address: { address: 127.0.0.1, port_value: 10000 } }
    listener_filters:
    - name: envoy.filters.listener.tls_inspector
      typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector }
    filter_chains:
    - filter_chain_match: { server_names: ["httpbin.org"] }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_certificates:
            - certificate_chain: { filename: "/Users/kamlesh/kytelang/varman/.e2e/httpbin.org.crt" }
              private_key: { filename: "/Users/kamlesh/kytelang/varman/.e2e/httpbin.org.key" }
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: bump_httpbin_org
          codec_type: AUTO
          route_config:
            name: r
            virtual_hosts:
            - name: httpbin.org
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: httpbin_upstream, host_rewrite_literal: httpbin.org, timeout: 30s }
          http_filters:
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  function envoy_on_request(handle)
                    local body = handle:body(true)
                    local b = ""
                    if body ~= nil and body:length() > 0 then b = body:getBytes(0, body:length()) end
                    local h, _ = handle:httpCall("content", { [":method"]="POST", [":path"]="/cf/check", [":authority"]="sidecar", ["content-type"]="text/plain" }, b, 5000)
                    if h == nil or h[":status"] ~= "200" then
                      handle:respond({ [":status"]="403", ["content-type"]="text/plain", ["x-acp-content-verdict"]="deny" }, "blocked by content policy\n")
                    end
                  end

          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - filter_chain_match: { server_names: ["api.anthropic.com"] }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
