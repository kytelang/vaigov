            tls_certificates:
            - certificate_chain: { filename: "/Users/kamlesh/kytelang/varman/.e2e/api.anthropic.com.crt" }
              private_key: { filename: "/Users/kamlesh/kytelang/varman/.e2e/api.anthropic.com.key" }
      filters:
